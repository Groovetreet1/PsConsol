<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <defs>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".55" stop-color="#e7edf8"/>
      <stop offset="1" stop-color="#9ca9bf"/>
    </linearGradient>
    <linearGradient id="cup" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f9ff"/>
      <stop offset=".5" stop-color="#d5ddec"/>
      <stop offset="1" stop-color="#98a5bc"/>
    </linearGradient>
    <linearGradient id="pad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3040"/>
      <stop offset="1" stop-color="#080b12"/>
    </linearGradient>
    <linearGradient id="led" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#43e7ff"/>
      <stop offset="1" stop-color="#2f7bff"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#2f7bff" stop-opacity=".4"/>
      <stop offset=".65" stop-color="#43e7ff" stop-opacity=".08"/>
      <stop offset="1" stop-color="#43e7ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="28" stdDeviation="24" flood-color="#000" flood-opacity=".6"/>
    </filter>
  </defs>

  <ellipse cx="300" cy="320" rx="270" ry="250" fill="url(#halo)"/>

  <g filter="url(#shadow)">
    <path d="M165 340 C150 235 210 132 300 128 C390 132 450 235 435 340" fill="none" stroke="url(#band)" stroke-width="38" stroke-linecap="round"/>
    <path d="M165 340 C150 235 210 132 300 128 C390 132 450 235 435 340" fill="none" stroke="#ffffff" stroke-opacity=".35" stroke-width="4" stroke-linecap="round"/>
    <path d="M196 330 C184 248 232 172 300 168 C368 172 416 248 404 330" fill="none" stroke="#1a1f2b" stroke-width="12" stroke-linecap="round" opacity=".85"/>

    <g transform="translate(147 330)">
      <rect x="0" y="0" width="86" height="160" rx="34" fill="url(#cup)"/>
      <rect x="12" y="22" width="62" height="116" rx="26" fill="url(#pad)"/>
      <rect x="12" y="22" width="62" height="116" rx="26" fill="none" stroke="#ffffff" stroke-opacity=".16"/>
      <rect x="24" y="96" width="38" height="4" rx="2" fill="url(#led)" filter="url(#glow)"/>
    </g>
    <g transform="translate(367 330)">
      <rect x="0" y="0" width="86" height="160" rx="34" fill="url(#cup)"/>
      <rect x="12" y="22" width="62" height="116" rx="26" fill="url(#pad)"/>
      <rect x="12" y="22" width="62" height="116" rx="26" fill="none" stroke="#ffffff" stroke-opacity=".16"/>
      <rect x="24" y="96" width="38" height="4" rx="2" fill="url(#led)" filter="url(#glow)"/>
    </g>

    <path d="M156 448 C158 492 180 512 210 512" fill="none" stroke="#aab6ca" stroke-width="6" stroke-linecap="round"/>
    <circle cx="214" cy="512" r="9" fill="#1a1f2b" stroke="#c3cddd" stroke-width="2"/>
  </g>
</svg>
