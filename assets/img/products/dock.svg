<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4356"/>
      <stop offset=".4" stop-color="#1a202c"/>
      <stop offset="1" stop-color="#080b11"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".55" stop-color="#e6edf8"/>
      <stop offset="1" stop-color="#9daac0"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1e29"/>
      <stop offset="1" stop-color="#06080d"/>
    </linearGradient>
    <linearGradient id="led" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#43e7ff"/>
      <stop offset="1" stop-color="#2f7bff"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#2f7bff" stop-opacity=".42"/>
      <stop offset=".65" stop-color="#43e7ff" stop-opacity=".08"/>
      <stop offset="1" stop-color="#43e7ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="26" stdDeviation="22" flood-color="#000" flood-opacity=".6"/>
    </filter>
  </defs>

  <ellipse cx="300" cy="330" rx="270" ry="240" fill="url(#halo)"/>

  <g filter="url(#shadow)">
    <path d="M160 460 L440 460 L482 516 Q300 550 118 516 Z" fill="url(#base)"/>
    <path d="M160 460 L440 460 L448 474 L152 474 Z" fill="#ffffff" opacity=".09"/>
    <ellipse cx="300" cy="524" rx="180" ry="18" fill="#000" opacity=".4"/>

    <g transform="translate(250 250)">
      <rect x="0" y="0" width="44" height="240" rx="20" fill="url(#dark)" stroke="#ffffff" stroke-opacity=".16"/>
      <rect x="38" y="20" width="70" height="200" rx="34" fill="url(#top)"/>
      <rect x="50" y="34" width="46" height="172" rx="23" fill="url(#dark)" stroke="#ffffff" stroke-opacity=".12"/>
      <rect x="58" y="150" width="30" height="4" rx="2" fill="url(#led)" filter="url(#glow)"/>
    </g>
    <g transform="translate(308 250)">
      <rect x="0" y="0" width="44" height="240" rx="20" fill="url(#dark)" stroke="#ffffff" stroke-opacity=".16"/>
      <rect x="-8" y="20" width="70" height="200" rx="34" fill="url(#top)"/>
      <rect x="4" y="34" width="46" height="172" rx="23" fill="url(#dark)" stroke="#ffffff" stroke-opacity=".12"/>
      <rect x="12" y="150" width="30" height="4" rx="2" fill="url(#led)" filter="url(#glow)"/>
    </g>

    <rect x="252" y="470" width="96" height="10" rx="5" fill="url(#led)" opacity=".8" filter="url(#glow)"/>
  </g>
</svg>
