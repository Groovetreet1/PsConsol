<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <defs>
    <linearGradient id="plateL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".55" stop-color="#e6edf8"/>
      <stop offset="1" stop-color="#9daac0"/>
    </linearGradient>
    <linearGradient id="plateR" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".55" stop-color="#e6edf8"/>
      <stop offset="1" stop-color="#9daac0"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4a5468"/>
      <stop offset=".08" stop-color="#161b26"/>
      <stop offset=".2" stop-color="#080b12"/>
      <stop offset=".8" stop-color="#080b12"/>
      <stop offset=".92" stop-color="#161b26"/>
      <stop offset="1" stop-color="#4a5468"/>
    </linearGradient>
    <linearGradient id="led" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bff7ff"/>
      <stop offset=".5" stop-color="#43e7ff"/>
      <stop offset="1" stop-color="#2f7bff"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#2f7bff" stop-opacity=".5"/>
      <stop offset=".6" stop-color="#43e7ff" stop-opacity=".1"/>
      <stop offset="1" stop-color="#43e7ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="26" stdDeviation="24" flood-color="#000" flood-opacity=".6"/>
    </filter>
  </defs>

  <ellipse cx="300" cy="330" rx="260" ry="290" fill="url(#halo)"/>
  <ellipse cx="300" cy="548" rx="150" ry="22" fill="#000" opacity=".45" filter="url(#soft)"/>

  <g filter="url(#soft)">
    <rect x="207" y="86" width="78" height="438" rx="46" fill="url(#plateL)"/>
    <rect x="207" y="86" width="78" height="438" rx="46" fill="none" stroke="#ffffff" stroke-opacity=".6"/>
    <path d="M207 300 q-16 60 0 130" fill="none" stroke="#ffffff" stroke-opacity=".25" stroke-width="10"/>
    <rect x="315" y="86" width="78" height="438" rx="46" fill="url(#plateR)"/>
    <rect x="315" y="86" width="78" height="438" rx="46" fill="none" stroke="#ffffff" stroke-opacity=".6"/>
    <rect x="266" y="78" width="68" height="454" rx="16" fill="url(#core)"/>
    <rect x="279" y="150" width="42" height="5" rx="2.5" fill="#010204"/>
    <rect x="279" y="150" width="42" height="1.5" rx=".75" fill="#ffffff" opacity=".18"/>
    <rect x="298" y="192" width="4" height="132" rx="2" fill="url(#led)" filter="url(#glow)"/>
    <rect x="290" y="370" width="20" height="6" rx="2" fill="#04060a" stroke="#43e7ff" stroke-opacity=".35"/>
    <circle cx="300" cy="470" r="4" fill="#0a0e16" stroke="#ffffff" stroke-opacity=".18"/>
  </g>

  <path d="M246 528 q54 22 108 0 l-10 16 q-44 16 -88 0z" fill="#141a25"/>
  <ellipse cx="300" cy="556" rx="86" ry="12" fill="#0a0d14"/>
</svg>
