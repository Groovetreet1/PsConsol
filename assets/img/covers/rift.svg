<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#030816"/>
      <stop offset=".55" stop-color="#071a2e"/>
      <stop offset="1" stop-color="#03050b"/>
    </linearGradient>
    <radialGradient id="portal" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#eaffff"/>
      <stop offset=".35" stop-color="#43e7ff" stop-opacity=".9"/>
      <stop offset=".7" stop-color="#2f7bff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#2f7bff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#43e7ff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#9df3ff" stop-opacity=".85"/>
      <stop offset="1" stop-color="#8a5cff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="armor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d7e3f3"/>
      <stop offset=".45" stop-color="#7f8ea8"/>
      <stop offset="1" stop-color="#111722"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#03050b" stop-opacity="0"/>
      <stop offset="1" stop-color="#03050b"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="600" height="750" fill="url(#space)"/>
  <g fill="#cfeaff">
    <circle cx="60" cy="90" r="1.6" opacity=".8"/>
    <circle cx="140" cy="160" r="1" opacity=".6"/>
    <circle cx="520" cy="80" r="1.8" opacity=".9"/>
    <circle cx="470" cy="180" r="1.1" opacity=".6"/>
    <circle cx="90" cy="280" r="1.3" opacity=".7"/>
    <circle cx="560" cy="300" r="1.2" opacity=".7"/>
    <circle cx="40" cy="470" r="1.5" opacity=".7"/>
    <circle cx="540" cy="500" r="1" opacity=".5"/>
    <circle cx="180" cy="60" r="1" opacity=".5"/>
    <circle cx="350" cy="50" r="1.4" opacity=".7"/>
  </g>

  <g filter="url(#glow)">
    <ellipse cx="300" cy="330" rx="210" ry="250" fill="url(#portal)" opacity=".55"/>
    <ellipse cx="300" cy="330" rx="150" ry="210" fill="none" stroke="url(#ring)" stroke-width="4"/>
    <ellipse cx="300" cy="330" rx="108" ry="160" fill="none" stroke="url(#ring)" stroke-width="2" opacity=".8"/>
    <ellipse cx="300" cy="330" rx="64" ry="104" fill="#020610" stroke="#43e7ff" stroke-opacity=".35" stroke-width="2"/>
  </g>

  <g fill="#16293f" stroke="#43e7ff" stroke-opacity=".25">
    <path d="M420 170 l36 -28 l26 34 l-30 34z"/>
    <path d="M120 450 l30 -22 l22 28 -26 26z"/>
    <path d="M470 520 l26 -18 l20 26 -24 22z"/>
    <path d="M80 200 l20 -14 l16 20 -18 18z"/>
  </g>

  <g transform="translate(360 470)">
    <ellipse cx="0" cy="250" rx="150" ry="22" fill="#000" opacity=".55"/>
    <path d="M-34 70 l70 0 l18 80 -10 100 h-26 l-10 -74 -8 74 h-28 l-8 -100z" fill="url(#armor)"/>
    <path d="M-44 92 l-34 66 18 12 30 -52z" fill="url(#armor)"/>
    <path d="M36 92 l30 30 12 -14 -26 -40z" fill="url(#armor)"/>
    <path d="M46 104 l92 -30 l8 18 -88 34z" fill="#182330"/>
    <path d="M130 82 l54 -18 l6 12 -52 24z" fill="#43e7ff" opacity=".65" filter="url(#glow)"/>
    <circle cx="4" cy="44" r="26" fill="#232f42"/>
    <path d="M-20 38 C-4 20 20 22 28 40 L20 54 L-8 56z" fill="#0b111b" stroke="#43e7ff" stroke-opacity=".4"/>
    <rect x="-10" y="46" width="28" height="4" fill="#43e7ff" opacity=".8"/>
  </g>

  <g fill="#43e7ff" opacity=".5">
    <circle cx="210" cy="420" r="2.4"/>
    <circle cx="170" cy="360" r="1.7"/>
    <circle cx="390" cy="250" r="2"/>
    <circle cx="450" cy="350" r="1.5"/>
  </g>

  <rect y="470" width="600" height="280" fill="url(#fade)"/>
</svg>
