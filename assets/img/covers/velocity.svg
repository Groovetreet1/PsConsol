<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0616"/>
      <stop offset=".5" stop-color="#170b2c"/>
      <stop offset="1" stop-color="#05040b"/>
    </linearGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1233"/>
      <stop offset="1" stop-color="#07050f"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4d6d" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ff4d6d" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ff4d6d" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#43e7ff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#43e7ff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#43e7ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#ff4d6d" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ff4d6d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
